# room-api.iscoded.com — The Room's public HTTP API.
#   /api/*   -> the lobby service (services/lobby) on 127.0.0.1:5310: rooms, match history, leaderboard.
#   /season  -> the season leaderboard (first 50 rows), kept for older links.
# The lobby's /internal/* routes (used by the rooms' own game servers on this box) are never proxied.
#
# Gameplay does NOT go through here: it's raw UDP (ENet) on room-udp.iscoded.com (DNS-only record,
# since Cloudflare's proxy can't carry UDP). This hostname is behind Cloudflare's proxy, HTTP only.
#
# Install / update: `make deploy-nginx`, or by hand:
#   sudo cp deploy/nginx/room-api.iscoded.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/room-api.iscoded.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d room-api.iscoded.com   # first install only: TLS + the 80->443 redirect
#
# This copy is the state AFTER certbot ran (it added the 443 block and the redirect below). Keep it
# in sync if certbot or anyone edits the live file. docs/server-config.md has the full install.

server {
    server_name room-api.iscoded.com;

    access_log /var/log/nginx/room-api.iscoded.com.access.log;
    error_log /var/log/nginx/room-api.iscoded.com.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:5310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
    }

    location = /season {
        proxy_pass http://127.0.0.1:5310/api/leaderboard?pageSize=50;
        add_header Cache-Control "no-store" always;
    }

    location / {
        default_type application/json;
        return 200 '{"service":"the-room-api","endpoints":["/api/rooms","/api/rooms/{code}","/api/matches?page=&pageSize=&player=","/api/matches/{id}","/api/leaderboard?page=&pageSize=","/season"]}';
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/room-api.iscoded.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/room-api.iscoded.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = room-api.iscoded.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name room-api.iscoded.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
