# room-api.iscoded.com — placeholder for The Room's future HTTP API
# (season leaderboard, award titles, match-summary webhook receiver — see
# plan/phase-6-meta-social.md and GDD.md §4/§7). Nothing is implemented yet:
# this just claims the hostname with a real TLS cert and a JSON placeholder
# response, so the domain is ready the day there's a backend to proxy to.
#
# The actual game server does NOT use this hostname or nginx at all — it's
# raw UDP (ENet) on room-udp.iscoded.com:60010, bypassing Cloudflare's proxy
# entirely (grey-cloud DNS record straight to the VPS). Cloudflare's proxy
# (orange cloud, used for this hostname) only carries HTTP(S).
#
# Install (Debian/Ubuntu-style):
#   sudo cp deploy/nginx/room-api.iscoded.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/room-api.iscoded.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d room-api.iscoded.com   # obtains + wires up TLS, rewrites this file
#
# When a real backend exists, replace the placeholder `location /` block
# below with a `proxy_pass` to it (see deploy/nginx examples from other
# apps on this box for the exact upstream/proxy_set_header pattern).
#
# This copy reflects the state AFTER certbot ran (deployed 2026-09-14) —
# it rewrote the file to add the 443/TLS server block and the 80->443
# redirect below. Keep this file in sync if you re-run certbot or edit
# the live config directly on the box.

server {
    server_name room-api.iscoded.com;

    access_log /var/log/nginx/room-api.iscoded.com.access.log;
    error_log /var/log/nginx/room-api.iscoded.com.error.log;

    location / {
        default_type application/json;
        return 200 '{"service":"the-room-api","status":"not implemented yet","see":"plan/phase-6-meta-social.md"}';
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/room-api.iscoded.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/room-api.iscoded.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = room-api.iscoded.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name room-api.iscoded.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
