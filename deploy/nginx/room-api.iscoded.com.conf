# room-api.iscoded.com — The Room's HTTP API. `/season` serves the real season leaderboard
# (core/SeasonStats.cs, written by the game server at res://season_stats.json ->
# /opt/the-room/app/season_stats.json on this box). Everything else is still a placeholder for
# GDD.md §4/§7 — awards feed, match-summary webhook receiver — nothing else implemented yet.
#
# The actual game server does NOT use this hostname or nginx at all for GAMEPLAY — that's raw
# UDP (ENet) on room-udp.iscoded.com:60010, bypassing Cloudflare's proxy entirely (grey-cloud DNS
# record straight to the VPS). Cloudflare's proxy (orange cloud, used for this hostname) only
# carries HTTP(S). The game server writes season_stats.json directly to disk; nginx here just
# reads that same file back out over HTTP — no process-to-process call between them at all.
#
# Install (Debian/Ubuntu-style):
#   sudo cp deploy/nginx/room-api.iscoded.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/room-api.iscoded.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d room-api.iscoded.com   # obtains + wires up TLS, rewrites this file
#
# This copy reflects the state AFTER certbot ran (deployed 2026-09-14) — it rewrote the file to
# add the 443/TLS server block and the 80->443 redirect below. Keep this file in sync if you
# re-run certbot or edit the live config directly on the box.

server {
    server_name room-api.iscoded.com;

    access_log /var/log/nginx/room-api.iscoded.com.access.log;
    error_log /var/log/nginx/room-api.iscoded.com.error.log;

    location = /season {
        alias /opt/the-room/app/season_stats.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        # 404s cleanly (rather than the placeholder JSON below) until the server has recorded
        # at least one match with a scorer — see core/SeasonStats.cs's RecordMatch guard.
    }

    location / {
        default_type application/json;
        return 200 '{"service":"the-room-api","status":"partially implemented","see":"plan/phase-6-meta-social.md","endpoints":["/season"]}';
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/room-api.iscoded.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/room-api.iscoded.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = room-api.iscoded.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name room-api.iscoded.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
